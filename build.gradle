plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.+'
}

version = mod_version
group = 'tfc_metallurgy'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
        data {
            data()
            programArguments.addAll '--mod', 'tfc_metallurgy', '--all',
                '--output', file('src/generated/resources/').absolutePath,
                '--existing', file('src/main/resources/').absolutePath
        }
    }

    mods {
        tfc_metallurgy {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'cursemaven'
        url = 'https://cfa2.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'Prog Maven'
        url = 'https://dvs1.progwml6.com/files/maven'
    }
    maven {
        name = 'crafttweaker'
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'Illusive Soulworks'
        url = 'https://maven.theillusivec4.top/'
    }
}

dependencies {
    implementation "curse.maven:terrafirmacraft-302973:${tfc_version}"

    // JEI - uncomment and update versions when ready
    // compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:19.5.+"
    // runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:19.5.+"

    runtimeOnly "vazkii.patchouli:Patchouli:1.21.1-92-NEOFORGE"
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : "TFC Metallurgy",
            "Specification-Vendor"    : "OfficialyMax",
            "Specification-Version"   : "1",
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : project.version,
            "Implementation-Vendor"   : "tfc_metallurgy",
        ])
    }
}
